[project]
name = "plug"
version = "0.1.0"
description = "iMessage watchdog + Claude auto-reply agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
plug = "plug.cli:app"
plug-watchdog = "watchdog.cli:app"
plug-supervisor = "supervisor_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plug", "watchdog", "supervisor_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
